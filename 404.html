<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | Hanzla Ghaffar</title>

    <meta name="robots" content="noindex">

    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        .error-page {
            max-width: 600px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            letter-spacing: -5px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #aaa;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 13px 25px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s;
        }

        a:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <main class="error-page">
        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            The page you're looking for doesn't exist or may have been moved.
        </p>

        <a href="./">Back to Home</a>
    </main>

</body>
</html>
